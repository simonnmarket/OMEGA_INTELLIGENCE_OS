<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA | Intelligence OS</title>
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-panel: #13131f;
            --text-primary: #ffffff;
            --text-secondary: #8b9bb4;
            --accent-primary: #00f2ff;
            --accent-secondary: #7000ff;
            --success: #00ff9d;
            --warning: #ffbf00;
            --danger: #ff0055;
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --font-ui: 'Inter', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-ui);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: var(--bg-panel);
            border-right: var(--glass-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            color: var(--accent-primary);
            font-family: var(--font-code);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            align-items: center;
        }

        .status-badge {
            background: rgba(0, 255, 157, 0.1);
            color: var(--success);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: var(--font-code);
            border: 1px solid rgba(0, 255, 157, 0.2);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--bg-panel);
            border: var(--glass-border);
            border-radius: 8px;
            padding: 20px;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-secondary), transparent);
            opacity: 0.5;
        }

        .card-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 2rem;
            font-family: var(--font-code);
            font-weight: bold;
        }

        .audit-container {
            background: #000;
            border: var(--glass-border);
            border-radius: 8px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: #ccc;
        }

        .log-entry {
            display: flex;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 5px 0;
        }

        .type-SYSTEM {
            color: var(--accent-primary);
        }

        .type-CONFLICT {
            color: var(--danger);
        }

        .type-PROCESS {
            color: var(--success);
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="logo">◆ OMEGA OS</div>
        <div style="color: var(--text-secondary); margin-bottom: 10px;">Dashboard</div>
        <div style="color: var(--text-secondary);">Modules</div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Mission Control</h1>
            <div class="status-badge" id="sys-status">SYSTEM ONLINE</div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <div class="card-title">System Health</div>
                <div class="card-value" style="color: var(--success)">98%</div>
            </div>
            <div class="card">
                <div class="card-title">Audit Events</div>
                <div class="card-value" id="stat-events">0</div>
            </div>
            <div class="card">
                <div class="card-title">Active Modules</div>
                <div class="card-value">7</div>
            </div>
        </div>

        <h2 style="margin-bottom: 15px; font-size: 1.2rem;">Live Audit Stream</h2>
        <div class="audit-container" id="audit-feed">
            <div class="log-entry">Initializing connection...</div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        async function updateDashboard() {
            try {
                const logsRes = await fetch(`${API_BASE}/audit`);
                const logs = await logsRes.json();

                document.getElementById('stat-events').textContent = logs.length;

                const feed = document.getElementById('audit-feed');
                feed.innerHTML = '';
                [...logs].reverse().forEach(log => {
                    const row = document.createElement('div');
                    row.className = 'log-entry';
                    row.innerHTML = `
                        <span style="color: #666">[${new Date(log.timestamp).toLocaleTimeString()}]</span>
                        <span class="type-${log.event_type}" style="width: 80px; font-weight: bold">${log.event_type}</span>
                        <span>${log.message}</span>
                    `;
                    feed.appendChild(row);
                });
            } catch (e) {
                console.log("Offline mode or connecting...");
            }
        }

        setInterval(updateDashboard, 2000);
        updateDashboard();
    </script>
</body>

</html>
