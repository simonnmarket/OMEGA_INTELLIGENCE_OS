<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA | Intelligence OS</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">Ω</div>
            <div class="brand-name">OMEGA OS</div>
        </div>

        <div class="nav-section">
            <div class="nav-category">Platform</div>
            <div class="nav-item active">
                <span>Dashboard</span>
            </div>
            <div class="nav-item">
                <span>Module Library</span>
            </div>
            <div class="nav-item">
                <span>Risk Control</span>
            </div>
        </div>

        <div class="nav-section">
            <div class="nav-category">System</div>
            <div class="nav-item">
                <span>Audit Logs</span>
            </div>
            <div class="nav-item">
                <span>Settings</span>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="page-title">Overview</div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span id="sys-status">OPERATIONAL</span>
            </div>
        </header>

        <div class="content-wrapper">
            <!-- Metrics Grid -->
            <div class="grid">
                <!-- Card 1 -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-label">Total Events</span>
                        <div class="card-icon">📊</div>
                    </div>
                    <div class="metric-container">
                        <span class="metric-value" id="stat-events">0</span>
                        <span class="metric-delta delta-positive">↑ Live</span>
                    </div>
                </div>

                <!-- Card 2 -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-label">Active Modules</span>
                        <div class="card-icon">🧩</div>
                    </div>
                    <div class="metric-container">
                        <span class="metric-value" id="stat-modules">7</span>
                        <span class="metric-delta delta-neutral">Stable</span>
                    </div>
                </div>

                <!-- Card 3 -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-label">System Health</span>
                        <div class="card-icon">❤️</div>
                    </div>
                    <div class="metric-container">
                        <span class="metric-value">98.9%</span>
                        <span class="metric-delta delta-positive">Optimal</span>
                    </div>
                </div>
            </div>

            <!-- Activity Feed -->
            <div class="section-header">
                <h2 class="section-title">Live Activity Stream</h2>
                <button class="nav-item" onclick="fetchData()"
                    style="padding: 6px 12px; font-size: 12px;">Refresh</button>
            </div>

            <div class="feed-container">
                <div class="feed-header">
                    <span>Message</span>
                    <span>Module</span>
                    <span>Timestamp</span>
                    <span>Status</span>
                </div>
                <div class="feed-list" id="audit-feed">
                    <!-- Feed items will be injected here -->
                    <div class="feed-item">
                        <span>Loading data...</span>
                        <span>--</span>
                        <span>--</span>
                        <span>...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
