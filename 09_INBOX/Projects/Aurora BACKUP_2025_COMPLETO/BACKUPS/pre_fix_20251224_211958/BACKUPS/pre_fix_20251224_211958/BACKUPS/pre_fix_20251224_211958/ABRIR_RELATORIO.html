<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora - Relatório de Conclusão NCNT v2.0</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .link-box {
            background: #f8f9fa;
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 20px;
            margin: 30px 0;
            word-break: break-all;
        }
        .link {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin: 10px 0;
        }
        .link:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .path {
            font-family: 'Courier New', monospace;
            color: #333;
            font-size: 12px;
            background: #fff;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border: 1px solid #ddd;
        }
        .info {
            color: #666;
            font-size: 14px;
            margin-top: 20px;
            line-height: 1.6;
        }
        .copy-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .copy-btn:hover {
            background: #218838;
        }
        .copy-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Aurora - Relatório de Conclusão</h1>
        <p class="subtitle">NCNT Module Template v2.0 - Integração Completa</p>
        
        <div class="link-box">
            <p style="margin: 0 0 15px 0; color: #333; font-weight: 600;">Clique para abrir o relatório:</p>
            <a href="file:///C:/Users/Lenovo/Projects/Aurora/RELATORIO_CONCLUSAO_NCNT_V2.md" class="link" id="openLink">
                📄 Abrir Relatório Completo
            </a>
        </div>
        
        <div class="path" id="filePath">
            C:\Users\Lenovo\Projects\Aurora\RELATORIO_CONCLUSAO_NCNT_V2.md
        </div>
        
        <button class="copy-btn" onclick="copyPath()">📋 Copiar Caminho</button>
        
        <div class="info">
            <p><strong>Status:</strong> ✅ Completo e Atualizado</p>
            <p><strong>Versão:</strong> 1.1 (Atualizado)</p>
            <p><strong>Data:</strong> 2025-12-11 23:45 CET</p>
        </div>
    </div>
    
    <script>
        function copyPath() {
            const path = document.getElementById('filePath').textContent;
            navigator.clipboard.writeText(path).then(function() {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ Copiado!';
                btn.style.background = '#28a745';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '#28a745';
                }, 2000);
            }).catch(function(err) {
                alert('Erro ao copiar. Caminho: ' + path);
            });
        }
        
        // Tentar abrir automaticamente se possível
        document.getElementById('openLink').addEventListener('click', function(e) {
            // Link file:// funciona na maioria dos navegadores
        });
    </script>
</body>
</html>
