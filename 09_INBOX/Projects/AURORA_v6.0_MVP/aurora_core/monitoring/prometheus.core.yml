global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'aurora-core'
    static_configs:
      - targets: ['aurora-core:9091']
    metrics_path: '/metrics'
    scrape_interval: 10s
    honor_labels: true

  - job_name: 'redis-cluster'
    static_configs:
      - targets: ['redis-1:9121', 'redis-2:9121', 'redis-3:9121']
    scrape_interval: 15s

  - job_name: 'vault'
    static_configs:
      - targets: ['vault:8200']
    metrics_path: '/v1/sys/metrics'
    params:
      format: ['prometheus']
    scrape_interval: 30s

rule_files:
  - "alerts.tier0.yml"

